<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sana &amp; Me — Best Friends Sanctuary</title>
    <meta name="description" content="A private, soft, and cozy sanctuary for best friends Sana & Azan." />
    <!-- PWA Web App Manifest & Mobile Web App Config -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sana & Me" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#fdfbf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121319" media="(prefers-color-scheme: dark)" />
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').catch(function(err) {
            console.warn('SW registration info:', err);
          });
        });
      }
    </script>
    <!-- Instant Theme & Dark Mode Pre-hydration -->
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('sana_theme_pref');
          var accent = localStorage.getItem('sana_accent_color') || 'blush';
          document.documentElement.setAttribute('data-accent', accent);
          var isDark = pref === 'dark' || ((!pref || pref === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/icons.js">
    <link rel="modulepreload" crossorigin href="./assets/vendor.js">
    <link rel="modulepreload" crossorigin href="./assets/supabase.js">
    <link rel="stylesheet" crossorigin href="./assets/app.css">
  </head>
  <body class="bg-cream-100 text-cream-900 dark:bg-cozydark-950 dark:text-cream-100 antialiased selection:bg-blush-200 dark:selection:bg-blush-900 selection:text-blush-900 dark:selection:text-blush-100 min-h-screen">
    <div id="root"></div>
    <script>
      (function() {
        // Fallback loader for static hosting (e.g. GitHub Pages serving repo root without build action)
        if (
          (window.location.hostname.endsWith('github.io') || window.location.protocol === 'file:') &&
          !document.querySelector('script[src*="./assets/"]')
        ) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.crossOrigin = 'anonymous';
          link.href = './assets/app.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/app.js';
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
