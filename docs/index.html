<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sana &amp; Me — Best Friends Sanctuary</title>
    <meta name="description" content="A private, soft, and cozy sanctuary for best friends Sana & Azan." />
    <!-- PWA Web App Manifest & Mobile Phone App Config -->
    <link rel="manifest" href="./assets/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sana & Me" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAF6ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0A0E" media="(prefers-color-scheme: dark)" />
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Global Error Recovery Listener -->
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#B6ACD0;background:#0C0A0E;text-align:center;">' +
            '<div style="font-size:36px;margin-bottom:12px;">🌸</div>' +
            '<h2 style="font-size:20px;color:#EDE7F7;margin:0 0 8px 0;font-weight:600;">Sana &amp; Azan Sanctuary</h2>' +
            '<p style="font-size:12px;max-width:320px;line-height:1.6;margin:0 0 16px 0;opacity:0.8;">Connecting to the sanctuary... Tap below if loading pauses.</p>' +
            '<button onclick="if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});});}if(\'caches\' in window){caches.keys().then(function(k){Promise.all(k.map(function(c){return caches.delete(c);})).then(function(){window.location.reload();});});}else{window.location.reload();}" style="padding:10px 22px;background:#E8638F;color:white;border:none;border-radius:16px;font-size:13px;cursor:pointer;font-weight:600;box-shadow:0 4px 14px rgba(232,99,143,0.35);">Refresh Sanctuary</button>' +
            '</div>';
        }
      });
    </script>
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(reg) {
            reg.update();
          }).catch(function(err) {
            console.warn('SW registration info:', err);
          });
        });
      }
    </script>
    <!-- Instant Theme & Dark Mode Pre-hydration -->
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('sana_theme_pref');
          var accent = localStorage.getItem('sana_accent_color') || 'blush';
          document.documentElement.setAttribute('data-accent', accent);
          var isDark = pref === 'dark' || ((!pref || pref === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/app.css">
  </head>
  <body class="bg-cream-100 text-cream-900 dark:bg-cozydark-950 dark:text-cream-100 antialiased min-h-screen">
    <div id="root"></div>
  </body>
</html>
